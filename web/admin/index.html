<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐厅掌柜 · 后台管理</title>
<link rel="stylesheet" href="../vendor/element-plus.css">
<script src="../vendor/vue.global.prod.js"></script>
<script src="../vendor/element-plus.full.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#F6F4F1; }
[v-cloak] { display:none; }
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg,#FF6A2B,#FF8A4C); }
.login-card { background:#fff; border-radius:18px; padding:38px 32px; width:100%; max-width:380px; box-shadow:0 24px 60px rgba(120,40,0,.3); }
.login-card h1 { font-size:22px; text-align:center; }
.login-card .sub { color:#9BA3B2; font-size:13px; text-align:center; margin:6px 0 24px; }
.login-card .err { color:#E5484D; font-size:13px; min-height:18px; margin-bottom:6px; }
.layout { display:flex; min-height:100vh; }
.side { width:196px; background:#1F2329; color:#C7CCD6; flex:none; display:flex; flex-direction:column; }
.logo { display:flex; align-items:center; gap:10px; padding:18px 16px; color:#fff; font-weight:800; font-size:16px; border-bottom:1px solid #333845; }
.logo .mark { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#FF6A2B,#FF8A4C); display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
.menu-item { display:flex; align-items:center; gap:10px; padding:13px 18px; cursor:pointer; font-size:14px; }
.menu-item:hover { background:#2A2F3A; }
.menu-item.active { background:linear-gradient(90deg,#FF6A2B,#FF8A4C); color:#fff; font-weight:700; }
.menu-item .i { width:26px; height:26px; border-radius:7px; background:#333845; display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; }
.menu-item.active .i { background:rgba(255,255,255,.25); }
.main { flex:1; padding:18px 22px; min-width:0; }
.topbar { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.topbar h2 { font-size:19px; }
.topbar .spacer { flex:1; }
.topbar .who { font-size:13px; color:#5A6370; background:#fff; border-radius:999px; padding:7px 16px; }
.panel { background:#fff; border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 12px rgba(31,35,41,.05); }
.panel h3 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
.stat-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
.stat { background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 12px rgba(31,35,41,.05); }
.stat .sl { font-size:12.5px; color:#9BA3B2; }
.stat .sv { font-size:26px; font-weight:800; margin:6px 0 4px; color:#1F2329; }
.stat .sv small { font-size:13px; font-weight:600; }
.stat .sf { font-size:12px; color:#9BA3B2; }
.stat .sf.up { color:#1F9D55; }
.bars { display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:10px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.bar-col .b { width:70%; background:linear-gradient(180deg,#FF8A4C,#FF6A2B); border-radius:6px 6px 0 0; min-height:4px; }
.bar-col .bl { font-size:11px; color:#9BA3B2; margin-top:6px; }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.warn-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; margin-bottom:8px; font-size:14px; }
.warn-row.red { background:#FDF0F0; color:#C0392B; }
.warn-row.yellow { background:#FFF7E0; color:#8A6100; }
.chat-box { border:1px solid #E5E7EB; border-radius:12px; padding:14px; height:280px; overflow-y:auto; margin-bottom:10px; font-size:14px; }
.chat-box .q { text-align:right; margin:8px 0; }
.chat-box .q span { display:inline-block; background:linear-gradient(90deg,#FF6A2B,#FF8A4C); color:#fff; border-radius:12px 4px 12px 12px; padding:9px 14px; max-width:80%; text-align:left; }
.chat-box .a { margin:8px 0; }
.chat-box .a span { display:inline-block; background:#F4F2EF; border-radius:4px 12px 12px 12px; padding:9px 14px; max-width:88%; white-space:pre-wrap; }
.report-body { white-space:pre-wrap; font-size:14px; line-height:1.9; background:#FBF9F6; border-radius:10px; padding:16px; }
.hint { font-size:12.5px; color:#9BA3B2; }
.dish-thumb { width:44px; height:44px; border-radius:8px; object-fit:cover; background:#F4F2EF; }
.dish-emoji { width:44px; height:44px; border-radius:8px; background:linear-gradient(135deg,#FFE9D9,#FFD3B0); display:inline-flex; align-items:center; justify-content:center; font-size:22px; }
.dish-preview { width:120px; height:120px; border-radius:10px; object-fit:cover; background:#F4F2EF; border:1px dashed #E2DDD5; }
/* 营业管理：开门 / 结单对账 */
.open-box { display:flex; gap:18px; background:#FFF7F0; border:1px solid #FFE0C2; border-radius:12px; padding:16px; margin-bottom:8px; flex-wrap:wrap; }
.ob-main { flex:1; min-width:280px; }
.ob-city { font-size:20px; font-weight:800; color:#1F2329; margin-bottom:6px; }
.ob-change { font-size:15px; font-weight:700; color:#5A6370; }
.ob-list { min-width:300px; flex:1.2; }
.ob-title { font-size:13px; font-weight:800; color:#B45309; margin-bottom:6px; }
.ob-item { font-size:13px; color:#5A6370; line-height:1.8; }
.panel-in { border:1px dashed #E2DDD5; border-radius:10px; padding:12px 14px; margin-top:12px; }
.panel-in h4 { font-size:13.5px; margin-bottom:10px; color:#1F2329; }
.rc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.rc-card { background:#FBF9F6; border:1px solid #EFEAE3; border-radius:12px; padding:14px; }
.rc-l { font-size:12.5px; color:#9BA3B2; }
.rc-v { font-size:22px; font-weight:800; color:#1F2329; margin-top:6px; }
.rc-formula { margin-top:12px; background:#F4F2EF; border-radius:10px; padding:10px 14px; font-size:13px; color:#5A6370; }
.rc-result { margin-top:12px; background:#FFF9F0; border:1px solid #FFE0C2; border-radius:12px; padding:14px 16px; max-width:560px; }
.rcr-line { display:flex; justify-content:space-between; font-size:13.5px; color:#5A6370; padding:4px 0; }
.rcr-line.big { font-size:15px; color:#1F2329; border-top:1px dashed #E2DDD5; margin-top:4px; padding-top:8px; }
.rcr-note { font-size:12px; color:#9BA3B2; margin-top:6px; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 登录 -->
  <div class="login-wrap" v-if="!token">
    <div class="login-card">
      <h1>餐厅掌柜</h1>
      <div class="sub">后台管理 · 老板与收银员日常使用</div>
      <el-input v-model="loginForm.username" placeholder="账号" size="large" style="margin-bottom:12px" @keyup.enter="doLogin"></el-input>
      <el-input v-model="loginForm.password" type="password" placeholder="密码" size="large" show-password @keyup.enter="doLogin"></el-input>
      <div class="err">{{ loginErr }}</div>
      <el-button type="primary" size="large" style="width:100%;background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none;font-weight:700" @click="doLogin">登 录</el-button>
    </div>
  </div>

  <!-- 主界面 -->
  <div class="layout" v-else>
    <div class="side">
      <div class="logo"><span class="mark">掌</span>餐厅掌柜</div>
      <div class="menu-item" v-for="m in menus" :key="m.key"
        :class="{active: page===m.key}" @click="switchPage(m.key)">
        <span class="i">{{ m.ico }}</span>{{ m.name }}
      </div>
      <div style="flex:1"></div>
      <div class="menu-item" @click="logout"><span class="i">出</span>退出登录</div>
    </div>

    <div class="main">
      <div class="topbar">
        <h2>{{ pageTitle }}</h2>
        <div class="spacer"></div>
        <span class="who">{{ staff.name }} · {{ roleText }}</span>
      </div>

      <!-- ============ 工作台 ============ -->
      <template v-if="page==='dash'">
        <div class="stat-cards">
          <div class="stat"><div class="sl">今日营业额 · 今日</div><div class="sv">¥{{ fmt(dash.today_revenue) }}</div><div class="sf" :class="{up: dash.today_revenue_delta_pct>=0}">较昨日 {{ dash.today_revenue_delta_pct>=0?'↑':'↓' }} {{ Math.abs(dash.today_revenue_delta_pct) }}% · 含待结账 ¥{{ fmt(dash.pending_amount) }}<template v-if="dash.today_free>0"> · 含免单 ¥{{ fmt(dash.today_free) }}</template></div></div>
          <div class="stat"><div class="sl">今日订单 · 今日</div><div class="sv">{{ dash.today_orders }} <small>单</small></div><div class="sf">待确认 {{ dash.pending_confirm_count }} 单</div></div>
          <div class="stat"><div class="sl">客单价 · 近7日</div><div class="sv">¥{{ dash.avg_price_7d }}</div><div class="sf up">实时计算</div></div>
          <div class="stat"><div class="sl">桌台占用 · 当前</div><div class="sv">{{ dash.table_occupied }}/{{ dash.table_total }}</div><div class="sf">待清台 {{ dash.table_dirty }} 桌</div></div>
        </div>
        <div class="panel">
          <h3>近 7 日营业额趋势</h3>
          <div class="bars">
            <div class="bar-col" v-for="d in trend" :key="d.date">
              <div class="b" :style="{height: trendMax ? (d.revenue/trendMax*100)+'%' : '4px'}"></div>
              <div class="bl">{{ d.date.slice(3) }}</div>
            </div>
          </div>
        </div>
        <div class="panel">
          <h3>实时订单 <el-button link type="primary" @click="switchPage('orders')">全部 ›</el-button></h3>
          <el-table :data="dash.recent_orders" size="small">
            <el-table-column prop="order_no" label="单号" width="130"></el-table-column>
            <el-table-column prop="table_name" label="桌台" width="70"></el-table-column>
            <el-table-column prop="total_amount" label="应收" width="90">
              <template #default="s">¥{{ rcv(s.row).toFixed(2) }}</template>
            </el-table-column>
            <el-table-column label="状态">
              <template #default="s"><el-tag :type="stType(s.row.status)" size="small">{{ s.row.status_text }}</el-tag></template>
            </el-table-column>
          </el-table>
        </div>
      </template>

      <!-- ============ 订单与收银 ============ -->
      <template v-if="page==='orders'">
        <div class="panel">
          <div class="toolbar">
            <el-select v-model="orderFilter.status" placeholder="全部状态" clearable size="default" style="width:140px" @change="loadOrders">
              <el-option v-for="(t, k) in statusMap" :key="k" :label="t" :value="k"></el-option>
            </el-select>
            <el-input v-model="orderFilter.date" placeholder="日期 2026-10-23" size="default" style="width:170px" @keyup.enter="loadOrders"></el-input>
            <el-button type="primary" @click="loadOrders" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none">查询</el-button>
          </div>
          <el-table :data="orders" size="small">
            <el-table-column prop="order_no" label="单号" width="135"></el-table-column>
            <el-table-column prop="table_name" label="桌台" width="70"></el-table-column>
            <el-table-column label="明细" min-width="180">
              <template #default="s">
                <span v-for="i in s.row.items" :key="i.id" style="margin-right:6px;font-size:12px">{{ i.name }}×{{ i.qty }}<template v-if="i.is_add"><b style="color:#E85518">(加)</b></template></span>
              </template>
            </el-table-column>
            <el-table-column prop="total_amount" label="应收" width="90" sortable>
              <template #default="s">¥{{ rcv(s.row).toFixed(2) }}</template>
            </el-table-column>
            <el-table-column prop="paid_amount" label="实收金额" width="100" sortable>
              <template #default="s">
                <span v-if="s.row.pay_status==='paid'" style="color:#E85518;font-weight:700">{{ s.row.pay_method==='free' ? '免单' : '¥' + (s.row.paid_amount != null ? s.row.paid_amount : rcv(s.row)).toFixed(2) }}</span>
                <span v-else style="color:#C0C4CC">—</span>
              </template>
            </el-table-column>
            <el-table-column prop="status" label="状态" width="90" sortable :sort-method="statusSort">
              <template #default="s"><el-tag :type="stType(s.row.status)" size="small">{{ s.row.status_text }}</el-tag></template>
            </el-table-column>
            <el-table-column prop="pay_method" label="支付" width="90" sortable :sort-method="paySort">
              <template #default="s">{{ s.row.pay_status==='paid' ? payText(s.row.pay_method) : '—' }}</template>
            </el-table-column>
            <el-table-column prop="created_at" label="时间" width="110" sortable></el-table-column>
            <el-table-column label="操作" width="150" fixed="right">
              <template #default="s">
                <el-button link type="primary" size="small" @click="openOrder(s.row)">详情</el-button>
                <el-button link type="success" size="small" v-if="s.row.pay_status==='pending'" @click="openSettle(s.row)">结账</el-button>
                <el-button link type="danger" size="small" v-if="isAdmin && ['pending_confirm','confirmed'].includes(s.row.status)" @click="quickCancel(s.row)">取消</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </template>

      <!-- ============ 菜品管理 ============ -->
      <template v-if="page==='dishes'">
        <div class="panel">
          <div class="toolbar">
            <el-select v-model="dishCatFilter" placeholder="全部分类" clearable size="default" style="width:150px">
              <el-option v-for="c in categories" :key="c.id" :label="c.name" :value="c.id"></el-option>
            </el-select>
            <div class="spacer" style="flex:1"></div>
            <el-button type="primary" @click="openDishEdit()" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none">＋ 新增菜品</el-button>
          </div>
          <el-table :data="filteredDishes" size="small">
            <el-table-column prop="id" label="ID" width="55"></el-table-column>
            <el-table-column label="菜品" min-width="200">
              <template #default="s">
                <div style="display:flex;align-items:center;gap:8px">
                  <img v-if="s.row.image" :src="s.row.image" class="dish-thumb">
                  <span v-else class="dish-emoji">{{ s.row.emoji || '' }}</span>
                  <div>
                    <div style="font-weight:600">{{ s.row.name }}</div>
                    <div style="font-size:12px;color:#909399" v-if="s.row.description">{{ s.row.description }}</div>
                  </div>
                </div>
              </template>
            </el-table-column>
            <el-table-column label="分类" width="90">
              <template #default="s">{{ catName(s.row.category_id) }}</template>
            </el-table-column>
            <el-table-column label="价格" width="80">
              <template #default="s">¥{{ s.row.price.toFixed(2) }}</template>
            </el-table-column>
            <el-table-column prop="sales" label="月售" width="70"></el-table-column>
            <el-table-column label="选项" min-width="140">
              <template #default="s">
                <el-tag size="small" type="info" v-if="!s.row.option_template || !Object.keys(s.row.option_template).length">无</el-tag>
                <el-tag size="small" type="warning" v-else v-for="(v,k) in s.row.option_template" :key="k" style="margin-right:4px">{{ k }}：{{ v.join('/') }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="BOM" width="110">
              <template #default="s">
                <el-tag size="small" :type="s.row.bom_count ? 'success' : 'danger'">{{ s.row.bom_count ? s.row.bom_count+' 种原料' : '未配置' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="状态" width="85">
              <template #default="s">
                <el-select v-model="s.row.status" size="small" @change="setDishStatus(s.row)">
                  <el-option label="上架" value="on"></el-option>
                  <el-option label="下架" value="off"></el-option>
                  <el-option label="售罄" value="soldout"></el-option>
                </el-select>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="150" fixed="right">
              <template #default="s">
                <el-button link type="primary" size="small" @click="openDishEdit(s.row)">编辑</el-button>
                <el-button link type="warning" size="small" @click="openBom(s.row)">配方</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
        <div class="panel">
          <h3>菜品分类 <el-button link type="primary" @click="openCatEdit()">＋ 新增分类</el-button></h3>
          <el-table :data="categories" size="small">
            <el-table-column prop="id" label="ID" width="60"></el-table-column>
            <el-table-column prop="name" label="名称"></el-table-column>
            <el-table-column prop="sort" label="排序" width="80"></el-table-column>
            <el-table-column label="操作" width="120">
              <template #default="s">
                <el-button link type="primary" size="small" @click="openCatEdit(s.row)">编辑</el-button>
                <el-button link type="danger" size="small" @click="delCat(s.row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </template>

      <!-- ============ 桌台管理 ============ -->
      <template v-if="page==='tables'">
        <div class="panel">
          <div class="toolbar">
            <div class="hint">桌台数量与编号自由配置 · 停用桌台顾客端不可下单 · 桌台码场景值 = 桌号</div>
            <div class="spacer" style="flex:1"></div>
            <el-button type="primary" @click="openTableEdit()" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none">＋ 新增桌台</el-button>
          </div>
          <el-table :data="tables" size="small">
            <el-table-column prop="name" label="桌号" width="90"></el-table-column>
            <el-table-column prop="area" label="区域" width="110"></el-table-column>
            <el-table-column prop="seats" label="座位" width="80"></el-table-column>
            <el-table-column label="状态" width="90">
              <template #default="s">
                <el-tag size="small" :type="s.row.enabled ? 'success' : 'info'">{{ s.row.enabled ? '启用' : '停用' }}</el-tag>
                <el-tag size="small" type="danger" v-if="s.row.dirty" style="margin-left:4px">待清台</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="150">
              <template #default="s">
                <el-button link type="primary" size="small" @click="openTableEdit(s.row)">编辑</el-button>
                <el-button link type="danger" size="small" @click="delTable(s.row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </template>

      <!-- ============ 原材料与采购 ============ -->
      <template v-if="page==='inv'">
        <div class="panel">
          <h3>库存预警（≤安全线红色 · ≤1.3 倍黄色）
            <span>
              <el-button size="small" type="primary" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none" @click="genPurchase">一键生成采购单</el-button>
            </span>
          </h3>
          <div v-if="!warnings.length" class="hint">当前没有需要补货的原料 ✓</div>
          <div class="warn-row" :class="w.level" v-for="w in warnings" :key="w.id">
            <b>{{ w.name }}</b> · 库存 {{ w.stock }} {{ w.unit }}（安全线 {{ w.safe_stock }}）
            · 建议采购 {{ w.suggest_qty }} {{ w.unit }} · 参考单价 ¥{{ w.ref_price }}
          </div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <el-button type="primary" @click="openIngEdit()" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none">＋ 新增原料</el-button>
          </div>
          <el-table :data="ingredients" size="small">
            <el-table-column prop="name" label="原料" min-width="110"></el-table-column>
            <el-table-column prop="unit" label="单位" width="70"></el-table-column>
            <el-table-column prop="stock" label="库存" width="100"></el-table-column>
            <el-table-column prop="safe_stock" label="安全线" width="90"></el-table-column>
            <el-table-column prop="ref_price" label="参考单价" width="90"></el-table-column>
            <el-table-column label="操作" width="170" fixed="right">
              <template #default="s">
                <el-button link type="primary" size="small" @click="openAdjust(s.row)">调整/报损</el-button>
                <el-button link type="warning" size="small" @click="openIngEdit(s.row)">编辑</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
        <div class="panel">
          <h3>采购单
            <span>
              <el-select v-model="poSupplier" placeholder="选择供应商" size="small" style="width:170px;margin-right:8px">
                <el-option v-for="s in suppliers" :key="s.id" :label="s.name" :value="s.id"></el-option>
              </el-select>
              <el-button size="small" type="primary" style="background:linear-gradient(90deg,#FF6A2B,#FF8A4C);border:none" @click="openPoEdit">＋ 新建采购单</el-button>
            </span>
          </h3>
          <el-table :data="purchases" size="small">

<script>
// 页面由后端托管（http://127.0.0.1:8000/web/admin/）时用同源地址（任意端口/域名都行）；
// 直接双击打开（file://）时默认连本机 8000 端口。
const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : location.origin;

const app = Vue.createApp({
  data() {
    return {
      token: localStorage.getItem('admin_token') || '',
      staff: JSON.parse(localStorage.getItem('admin_staff') || 'null'),
      loginForm: { username: '', password: '' },
      loginErr: '',
      page: 'dash',
      // 数据
      dash: {}, trend: [], trend30: [],
      orders: [], orderFilter: { status: '', date: '' },
      categories: [], dishes: [], dishCatFilter: null, dishImgUploading: false,
      tables: [],
      ingredients: [], warnings: [], invLogs: [], suppliers: [], purchases: [], poSupplier: null,
      lossCompare: [], topDishes: [],
      aiReports: [], aiType: 'daily', aiReport: '', aiLoading: false,
      chatMsgs: [], chatInput: '',
      shopForm: {}, staffList: [],
      // 营业管理（开门 / 结单）
      day: { live: {}, history: [], opened: null, closed: null, expected_cash_box: 0 },
      dayOpenForm: { change: '100' },
      dayCloseForm: { cash_box: '', note: '' },
      // 弹窗
      orderDetailShow: false, orderDetail: null,
      settleShow: false, settleOrder: null, settleForm: { method: 'cash', discount: '0.00', paid: '0.00', note: '' },
      dishEditShow: false, dishForm: {},
      bomShow: false, bomDish: null, bomRows: [],
      tableEditShow: false, tableForm: {},
      ingEditShow: false, ingForm: {},
      adjustShow: false, adjustIng: null, adjustForm: { type: 'stocktake', delta: 0, remark: '' },
      poEditShow: false, poForm: { supplier_id: null, items: [{ ingredient_id: null, qty: 0, unit_price: 0 }], remark: '' },
      catEditShow: false, catForm: {},
      staffEditShow: false, staffForm: {},
      supplierEditShow: false, supplierForm: {},
      statusMap: { pending_confirm: '待确认', confirmed: '已确认', served: '已出餐', paid: '已结账', cancelled: '已取消' },
    };
  },
  computed: {
    isAdmin() { return this.staff && this.staff.role === 'admin'; },
    roleText() { return ({ admin: '店长', cashier: '收银', waiter: '服务员', kitchen: '后厨' })[this.staff && this.staff.role] || ''; },
    menus() {
      const all = [
        { key: 'dash', name: '工作台', ico: '台' },
        { key: 'orders', name: '订单与收银', ico: '单' },
        { key: 'dishes', name: '菜品管理', ico: '菜' },
        { key: 'tables', name: '桌台管理', ico: '桌' },
        { key: 'inv', name: '原材料与采购', ico: '材' },
        { key: 'loss', name: '损耗与成本', ico: '损' },
        { key: 'stats', name: '统计报表', ico: '报' },
        { key: 'ai', name: 'AI 经营分析', ico: '智' },
        { key: 'day', name: '营业管理', ico: '营' },
        { key: 'sys', name: '系统设置', ico: '设' },
      ];
      if (!this.isAdmin) return all.filter((m) => ['dash', 'orders', 'ai'].includes(m.key));
      return all;
    },
    pageTitle() {
      return (this.menus.find((m) => m.key === this.page) || { name: '' }).name;
    },
    filteredDishes() {
      if (!this.dishCatFilter) return this.dishes;
      return this.dishes.filter((d) => d.category_id === this.dishCatFilter);
    },
    trendMax() { return Math.max(1, ...this.trend.map((d) => d.revenue)); },
    trend30Max() { return Math.max(1, ...this.trend30.map((d) => d.revenue)); },
    settleReceivable() {
      if (!this.settleOrder) return 0;
      if (this.settleForm.method === 'free') return 0;
      const n = this.parseAmount(this.settleForm.discount);
      return Math.max(0, Number((this.rcv(this.settleOrder) - (isNaN(n) ? 0 : this.clampAmount(n))).toFixed(2)));
    },
    settlePaidText() {
      const n = this.parseAmount(this.settleForm.paid);
      return (isNaN(n) ? 0 : n).toFixed(2);
    },
  },
  methods: {
    fmt(n) { return (n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); },
    stType(s) {
      return { pending_confirm: 'warning', confirmed: 'primary', served: 'success', paid: 'info', cancelled: 'danger' }[s] || 'info';
    },
    catName(id) { const c = this.categories.find((x) => x.id === id); return c ? c.name : ''; },
    roleTextOf(r) { return ({ admin: '店长', cashier: '收银', waiter: '服务员', kitchen: '后厨' })[r] || r; },
    msg(text, type) { this.$message({ message: text, type: type || 'success' }); },
    async api(url, method, body) {
      const res = await fetch(API_BASE + url, {
        method: method || 'GET',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        if (res.status === 401) this.logout();
        throw new Error(data.detail || '请求失败');
      }
      return data;
    },
    async doLogin() {
      this.loginErr = '';
      try {
        const data = await (await fetch(API_BASE + '/api/staff/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.loginForm),
        })).json();
        if (!data.token) { this.loginErr = data.detail || '登录失败'; return; }
        if (!['admin', 'cashier'].includes(data.staff.role)) { this.loginErr = '该账号无后台权限（仅店长/收银）'; return; }
        this.token = data.token; this.staff = data.staff;
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_staff', JSON.stringify(data.staff));
        this.boot();
      } catch (e) { this.loginErr = '无法连接服务器'; }
    },
    logout() {
      localStorage.removeItem('admin_token'); localStorage.removeItem('admin_staff');
      this.token = ''; this.staff = null;
    },
    boot() {
      this.switchPage('dash');
    },
    async switchPage(key) {
      this.page = key;
      try {
        if (key === 'dash') {
          this.dash = await this.api('/api/admin/dashboard');
          this.trend = await this.api('/api/admin/stats/trend?days=7');
        } else if (key === 'orders') {
          await this.loadOrders();
        } else if (key === 'dishes') {
          const [cats, dishes] = await Promise.all([
            this.api('/api/admin/categories'), this.api('/api/admin/dishes'),
          ]);
          this.categories = cats; this.dishes = dishes;
        } else if (key === 'tables') {
          this.tables = await this.api('/api/admin/tables');
        } else if (key === 'inv') {
          const [ings, ws, pos, sups] = await Promise.all([
            this.api('/api/admin/ingredients'), this.api('/api/admin/inventory/warnings'),
            this.api('/api/admin/purchases'), this.api('/api/admin/suppliers'),
          ]);
          this.ingredients = ings; this.warnings = ws; this.purchases = pos; this.suppliers = sups;
        } else if (key === 'loss') {
          const [lc, logs] = await Promise.all([
            this.api('/api/admin/stats/loss-compare'), this.api('/api/admin/inventory/logs'),
          ]);
          this.lossCompare = lc; this.invLogs = logs;
        } else if (key === 'stats') {
          const [top, t30] = await Promise.all([
            this.api('/api/admin/stats/top-dishes?days=30'),
            this.api('/api/admin/stats/trend?days=30'),
          ]);
          this.topDishes = top; this.trend30 = t30;
        } else if (key === 'ai') {
          this.aiReports = await this.api('/api/admin/ai/reports');
        } else if (key === 'sys') {
          const [shop, st, sups] = await Promise.all([
            this.api('/api/admin/shop'), this.api('/api/admin/staff'), this.api('/api/admin/suppliers'),
          ]);
          this.shopForm = { ...shop }; this.staffList = st; this.suppliers = sups;
        } else if (key === 'day') {
          await this.loadDay();
        }
      } catch (e) {
        if (e.message.includes('无权限')) this.msg(e.message, 'error');
      }
    },
    // ---- 营业管理（开门 / 结单对账） ----
    async loadDay() {
      try {
        this.day = await this.api('/api/admin/day/status');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async submitOpen() {
      try {
        const change = parseFloat(this.dayOpenForm.change);
        const body = {};
        if (!isNaN(change) && change >= 0) body.change = change;
        const data = await this.api('/api/admin/day/open', 'POST', body);
        this.msg('开门成功 · ' + data.weather);
        await this.loadDay();
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async submitClose() {
      const n = parseFloat(this.dayCloseForm.cash_box);
      if (isNaN(n) || n < 0) { this.msg('请填写钱箱现金实点金额', 'error'); return; }
      try {
        const data = await this.api('/api/admin/day/close', 'POST', {
          cash_box: Number(n.toFixed(2)),
          note: this.dayCloseForm.note || '',
        });
        await this.loadDay();
        const d = data.closed;
        const ok = Math.abs(Number(d.diff)) < 0.005;
        this.$alert(
          '钱箱实点 ¥' + d.cash_box.toFixed(2) + '，期望 ¥' + this.fmt(this.day.expected_cash_box)
          + '，差额 ' + (d.diff >= 0 ? '+' : '') + d.diff.toFixed(2) + ' 元。'
          + (ok ? '钱对得上 ✓' : '钱对不上，请核对差额原因'),
          ok ? '结单完成 · 对账一致' : '结单完成 · 存在差额',
          { type: ok ? 'success' : 'warning', confirmButtonText: '知道了' },
        ).catch(() => {});
      } catch (e) { this.msg(e.message, 'error'); }
    },
    // ---- 订单 ----
    async loadOrders() {
      const q = new URLSearchParams();
      if (this.orderFilter.status) q.set('status', this.orderFilter.status);
      if (this.orderFilter.date) q.set('date', this.orderFilter.date);
      this.orders = await this.api('/api/admin/orders?' + q.toString());
    },
    async openOrder(o) {
      this.orderDetail = await this.api('/api/admin/orders/' + o.id);
      this.orderDetailShow = true;
    },
    payText(m) { return ({ cash: '现金', wechat: '微信', alipay: '支付宝', free: '免单' })[m] || m || '—'; },
    // 应收 = 菜品合计 + 餐具费（每人 1 元）
    fee(o) { return Number(o.utensil_fee || 0); },
    rcv(o) { return Number(o.total_amount || 0) + Number(o.utensil_fee || 0); },
    statusSort(a, b) {
      // 状态按业务流程排序：待确认 → 已确认 → 已出餐 → 已结账 → 已取消
      const order = ['pending_confirm', 'confirmed', 'served', 'paid', 'cancelled'];
      return order.indexOf(a.status) - order.indexOf(b.status);
    },
    paySort(a, b) {
      // 支付：未支付排后；已支付按 微信 → 支付宝 → 现金
      const ap = a.pay_status === 'paid', bp = b.pay_status === 'paid';
      if (ap !== bp) return ap ? -1 : 1;
      if (!ap) return 0;
      const order = ['wechat', 'alipay', 'cash'];
      return order.indexOf(a.pay_method) - order.indexOf(b.pay_method);
    },
    openSettle(o) {
      this.settleOrder = o;
      this.settleForm = { method: 'cash', discount: '0.00', paid: this.rcv(o).toFixed(2), note: '' };
      this.settleShow = true;
    },
    onMethodChange(m) {
      // 切换免单/收款：免单时优惠全额冲抵、实收 0；恢复收款时回到全额实收
      if (m === 'free') {
        this.settleForm.discount = this.rcv(this.settleOrder).toFixed(2);
        this.settleForm.paid = '0.00';
      } else {
        this.settleForm.discount = '0.00';
        this.settleForm.paid = this.rcv(this.settleOrder).toFixed(2);
      }
    },
    // ---- 结账金额输入（纯文本输入，边输边联动；回车/失焦时规范为两位小数） ----
    parseAmount(s) {
      if (s === null || s === undefined) return NaN;
      const t = String(s).trim();
      if (t === '' || t === '.') return NaN;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    },
    clampAmount(n) {
      const total = this.rcv(this.settleOrder);
      return Math.min(total, Math.max(0, n));
    },
    onDiscountInput() {
      // 改优惠 → 实收 = 应收 − 优惠（输入框本框保持原样，只联动对方）
      const n = this.parseAmount(this.settleForm.discount);
      if (isNaN(n)) { this.settleForm.paid = ''; return; }
      this.settleForm.paid = (this.rcv(this.settleOrder) - this.clampAmount(n)).toFixed(2);
    },
    onPaidInput() {
      // 改实收 → 优惠 = 应收 − 实收（输入框本框保持原样，只联动对方）
      const n = this.parseAmount(this.settleForm.paid);
      if (isNaN(n)) { this.settleForm.discount = ''; return; }
      this.settleForm.discount = (this.rcv(this.settleOrder) - this.clampAmount(n)).toFixed(2);
    },
    onDiscountBlur() {
      const n = this.parseAmount(this.settleForm.discount);
      const total = this.rcv(this.settleOrder);
      const c = isNaN(n) ? 0 : this.clampAmount(n);
      this.settleForm.discount = c.toFixed(2);
      this.settleForm.paid = (total - c).toFixed(2);
    },
    onPaidBlur() {
      const n = this.parseAmount(this.settleForm.paid);
      const total = this.rcv(this.settleOrder);
      const c = isNaN(n) ? total : this.clampAmount(n);
      this.settleForm.paid = c.toFixed(2);
      this.settleForm.discount = (total - c).toFixed(2);
    },
    async submitSettle() {
      const total = this.rcv(this.settleOrder);
      const isFree = this.settleForm.method === 'free';
      if (isFree) {
        if (!(this.settleForm.note || '').trim()) { this.msg('免单需填写免单原因', 'error'); return; }
        try {
          await this.$confirm('确认免单 ' + this.settleOrder.order_no + '？实收 0 元，按应收 ¥' + total.toFixed(2) + ' 计入营业额', '免单确认', { type: 'warning' });
        } catch (e) { return; }
      }
      const discount = this.clampAmount(this.parseAmount(this.settleForm.discount));
      const paid = this.clampAmount(this.parseAmount(this.settleForm.paid));
      if (isNaN(discount) || isNaN(paid)) { this.msg('请填写优惠金额与实际收款', 'error'); return; }
      if (Math.abs(discount + paid - total) > 0.01) {
        this.msg('优惠金额 + 实收金额 必须等于应收金额 ¥' + total.toFixed(2), 'error');
        return;
      }
      try {
        const data = await this.api('/api/admin/orders/' + this.settleOrder.id + '/settle', 'POST', {
          method: this.settleForm.method,
          discount: Number(discount.toFixed(2)),
          paid_amount: Number(paid.toFixed(2)),
          settle_note: this.settleForm.note || '',
        });
        this.msg(isFree ? '已免单（实收 0 元，按应收计入营业额）' : '收款成功');
        this.settleShow = false;
        this.orderDetailShow = false;
        this.loadOrders();
        if (this.page === 'dash') this.dash = await this.api('/api/admin/dashboard');
        // 收款完成后提示打印小票
        this.$confirm('收款完成，是否立即打印小票？', '打印小票', {
          confirmButtonText: '打印小票',
          cancelButtonText: '稍后再打',
          type: 'success',
        }).then(() => this.printReceipt(data)).catch(() => {});
      } catch (e) { this.msg(e.message, 'error'); }
    },
    // ---- 打印小票（58mm 样式，浏览器打印对话框） ----
    esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },
    async printReceipt(o) {
      let shop = this.shopForm && this.shopForm.name ? { ...this.shopForm } : null;
      if (!shop) {
        try { shop = await this.api('/api/admin/shop'); } catch (e) { shop = null; }
      }
      const items = (o.items || []).map((it) => {
        const opts = it.options && Object.keys(it.options).length ? Object.values(it.options).join('/') : '';
        return '<div class="line"><span class="name">' + this.esc(it.name) + (it.is_add ? '（加）' : '')
          + (opts ? '<br><span class="opt">' + this.esc(opts) + '</span>' : '')
          + '</span><span class="q">×' + it.qty + '</span><span class="amt">' + Number(it.price * it.qty).toFixed(2) + '</span></div>';
      }).join('');
      const discount = Number(o.discount || 0);
      const paid = o.paid_amount != null ? Number(o.paid_amount) : this.rcv(o);
      const remark = o.remark || '';
      const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>小票</title><style>'
        + 'body{font-family:"Microsoft YaHei",sans-serif;font-size:12px;color:#111;width:200px;margin:0 auto;padding:10px 4px;}'
        + '.c{text-align:center}.shop{font-size:16px;font-weight:800;margin:4px 0 2px}.sub{color:#666;font-size:11px;margin-bottom:6px}'
        + '.dash{border-top:1px dashed #999;margin:6px 0}'
        + '.kv{display:flex;justify-content:space-between;margin:1px 0}'
        + '.line{display:flex;margin:2px 0}.line .name{flex:1}.line .q{width:34px;text-align:right}.line .amt{width:56px;text-align:right}'
        + '.opt{color:#888;font-size:11px}.big{font-weight:800}.foot{text-align:center;margin-top:8px}'
        + '@media print{body{width:58mm}}'
        + '</style></head><body>'
        + '<div class="c"><div class="shop">' + this.esc((shop && shop.name) || '欢迎光临') + '</div>'
        + '<div class="sub">' + this.esc((shop && shop.address) || '') + ' ' + this.esc((shop && shop.phone) || '') + '</div></div>'
        + '<div class="dash"></div>'
        + '<div class="kv"><span>单号</span><span>' + this.esc(o.order_no) + '</span></div>'
        + '<div class="kv"><span>桌台</span><span>' + this.esc(o.table_name || '外带') + '</span></div>'
        + '<div class="kv"><span>' + (o.is_takeout ? '打包盒' : '人数 / 餐具') + '</span><span>' + (o.is_takeout ? (o.utensils || 0) + ' 个' : (o.people || 1) + ' 人 / ' + (o.utensils || 0) + ' 份') + '</span></div>'
        + '<div class="kv"><span>下单时间</span><span>' + this.esc(o.created_at || '') + '</span></div>'
        + '<div class="kv"><span>结账时间</span><span>' + this.esc(o.paid_at || '') + '</span></div>'
        + '<div class="dash"></div>'
        + items
        + '<div class="dash"></div>'
        + '<div class="kv"><span>菜品合计</span><span>' + Number(o.total_amount || 0).toFixed(2) + '</span></div>'
        + '<div class="kv"><span>' + this.esc(o.fee_label || '餐具费') + '</span><span>' + this.fee(o).toFixed(2) + '</span></div>'
        + '<div class="kv big"><span>应收</span><span>' + this.rcv(o).toFixed(2) + '</span></div>'
        + (discount > 0 ? '<div class="kv"><span>优惠</span><span>-' + discount.toFixed(2) + '</span></div>' : '')
        + '<div class="kv big"><span>实收（' + this.payText(o.pay_method) + '）</span><span>' + paid.toFixed(2) + '</span></div>'
        + (o.pay_method === 'free' && o.settle_note ? '<div class="kv"><span>免单原因</span><span>' + this.esc(o.settle_note) + '</span></div>' : '')
        + (remark ? '<div class="kv"><span>备注</span><span>' + this.esc(remark) + '</span></div>' : '')
        + '<div class="dash"></div>'
        + '<div class="foot">谢谢惠顾，欢迎再次光临！</div>'
        + '</body></html>';
      const w = window.open('', '_blank');
      if (!w) { this.msg('浏览器拦截了弹窗，请允许弹出窗口后重试', 'error'); return; }
      w.document.open();
      w.document.write(html);
      w.document.close();
      setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 400);
    },
    async quickCancel(o) {
      try {
        await this.$confirm('确定取消订单 ' + o.order_no + '？', '取消订单', { type: 'warning' });
        await this.api('/api/admin/orders/' + o.id + '/cancel', 'POST', { reason: '店方取消' });
        this.msg('已取消');
        this.loadOrders();
      } catch (e) { if (e !== 'cancel') this.msg(e.message, 'error'); }
    },
    // ---- 菜品 ----
    openDishEdit(row) {
      this.dishForm = row ? { ...row, optionJson: JSON.stringify(row.option_template || {}, null, 0) } : { name: '', category_id: null, price: 0, description: '', emoji: '', image: '', optionJson: '{}' };
      this.dishEditShow = true;
    },
    onDishImgError(e) { e.target.style.display = 'none'; },
    pickDishImg() { this.$refs.dishImgInput.click(); },
    async onDishImgPicked(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { this.msg('图片不能超过 8MB', 'error'); return; }
      const fd = new FormData();
      fd.append('file', f);
      this.dishImgUploading = true;
      try {
        const r = await fetch('/api/admin/upload/image', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token }, body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || '上传失败');
        this.dishForm.image = j.url;
        this.msg('图片已上传到云端图库');
      } catch (err) { this.msg(err.message || '上传失败', 'error'); }
      this.dishImgUploading = false;
    },
    async saveDish() {
      let tpl = {};
      try { tpl = JSON.parse(this.dishForm.optionJson || '{}'); }
      catch (e) { this.msg('选项模板 JSON 格式错误', 'error'); return; }
      const body = {
        category_id: this.dishForm.category_id, name: this.dishForm.name,
        price: this.dishForm.price, description: this.dishForm.description || '',
        option_template: tpl,
        image: (this.dishForm.image || '').trim(),
        emoji: (this.dishForm.emoji || '').trim(),
      };
      try {
        if (this.dishForm.id) await this.api('/api/admin/dishes/' + this.dishForm.id, 'PUT', body);
        else await this.api('/api/admin/dishes', 'POST', { ...body, status: 'on' });
        this.dishEditShow = false;
        this.msg('已保存');
        this.switchPage('dishes');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async setDishStatus(row) {
      try {
        await this.api('/api/admin/dishes/' + row.id + '/status', 'POST', { status: row.status });
        this.msg(row.name + ' → ' + ({ on: '上架', off: '下架', soldout: '售罄' })[row.status]);
      } catch (e) { this.msg(e.message, 'error'); this.switchPage('dishes'); }
    },
    async openBom(row) {
      this.bomDish = row;
      const bom = await this.api('/api/admin/dishes/' + row.id + '/bom');
      this.bomRows = bom.length ? bom.map((b) => ({ ingredient_id: b.ingredient_id, quantity: b.quantity, loss_rate: b.loss_rate }))
        : [{ ingredient_id: null, quantity: 0, loss_rate: 0 }];
      this.bomShow = true;
    },
    async saveBom() {
      try {
        await this.api('/api/admin/dishes/' + this.bomDish.id + '/bom', 'PUT', {
          items: this.bomRows.filter((b) => b.ingredient_id).map((b) => ({ ingredient_id: b.ingredient_id, quantity: b.quantity, loss_rate: b.loss_rate })),
        });
        this.bomShow = false;
        this.msg('配方已保存');
        this.switchPage('dishes');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    openCatEdit(row) {
      this.catForm = row ? { ...row } : { name: '', sort: 0 };
      this.catEditShow = true;
    },
    async saveCat() {
      try {
        if (this.catForm.id) await this.api('/api/admin/categories/' + this.catForm.id, 'PUT', this.catForm);
        else await this.api('/api/admin/categories', 'POST', this.catForm);
        this.catEditShow = false;
        this.msg('已保存');
        this.switchPage('dishes');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async delCat(row) {
      try {
        await this.$confirm('删除分类「' + row.name + '」？分类下有菜品时不能删除', '删除', { type: 'warning' });
        await this.api('/api/admin/categories/' + row.id, 'DELETE');
        this.msg('已删除');
        this.switchPage('dishes');
      } catch (e) { if (e !== 'cancel') this.msg(e.message, 'error'); }
    },
    // ---- 桌台 ----
    openTableEdit(row) {
      this.tableForm = row ? { ...row } : { name: '', area: '大厅', seats: 4, enabled: true };
      this.tableEditShow = true;
    },
    async saveTable() {
      try {
        if (this.tableForm.id) await this.api('/api/admin/tables/' + this.tableForm.id, 'PUT', this.tableForm);
        else await this.api('/api/admin/tables', 'POST', this.tableForm);
        this.tableEditShow = false;
        this.msg('已保存');
        this.switchPage('tables');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async delTable(row) {
      try {
        await this.$confirm('删除桌台 ' + row.name + '？', '删除', { type: 'warning' });
        await this.api('/api/admin/tables/' + row.id, 'DELETE');
        this.msg('已删除');
        this.switchPage('tables');
      } catch (e) { if (e !== 'cancel') this.msg(e.message, 'error'); }
    },
    // ---- 原料与采购 ----
    openIngEdit(row) {
      this.ingForm = row ? { ...row } : { name: '', unit: 'g', stock: 0, safe_stock: 0, ref_price: 0 };
      this.ingEditShow = true;
    },
    async saveIng() {
      try {
        if (this.ingForm.id) await this.api('/api/admin/ingredients/' + this.ingForm.id, 'PUT', this.ingForm);
        else await this.api('/api/admin/ingredients', 'POST', this.ingForm);
        this.ingEditShow = false;
        this.msg('已保存');
        this.switchPage('inv');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    openAdjust(row) {
      this.adjustIng = row;
      this.adjustForm = { type: 'stocktake', delta: 0, remark: '' };
      this.adjustShow = true;
    },
    async saveAdjust() {
      try {
        await this.api('/api/admin/ingredients/' + this.adjustIng.id + '/adjust', 'POST', this.adjustForm);
        this.adjustShow = false;
        this.msg('已调整');
        this.switchPage('inv');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async genPurchase() {
      try {
        const q = this.poSupplier ? '?supplier_id=' + this.poSupplier : '';
        const po = await this.api('/api/admin/purchases/generate-from-warnings' + q, 'POST');
        this.msg('已按预警生成采购单 ' + po.order_no);
        this.switchPage('inv');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    openPoEdit() {
      if (!this.poSupplier) { this.msg('请先选择供应商', 'warning'); return; }
      this.poForm = { supplier_id: this.poSupplier, items: [{ ingredient_id: null, qty: 0, unit_price: 0 }], remark: '' };
      this.poEditShow = true;
    },
    async savePo() {
      try {
        await this.api('/api/admin/purchases', 'POST', {
          supplier_id: this.poForm.supplier_id,
          items: this.poForm.items.filter((p) => p.ingredient_id),
          remark: this.poForm.remark,
        });
        this.poEditShow = false;
        this.msg('采购单已创建');
        this.switchPage('inv');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async inbound(row) {
      try {
        await this.$confirm('确认 ' + row.order_no + ' 全部到货入库？', '采购入库', { type: 'warning' });
        await this.api('/api/admin/purchases/' + row.id + '/inbound', 'POST');
        this.msg('已入库');
        this.switchPage('inv');
      } catch (e) { if (e !== 'cancel') this.msg(e.message, 'error'); }
    },
    // ---- AI ----
    async genReport() {
      this.aiLoading = true;
      try {
        const r = await this.api('/api/admin/ai/reports', 'POST', { type: this.aiType });
        this.aiReport = r.content;
        this.aiReports = await this.api('/api/admin/ai/reports');
      } catch (e) { this.msg(e.message, 'error'); }
      this.aiLoading = false;
    },
    async sendChat() {
      const q = this.chatInput.trim();
      if (!q) return;
      this.chatMsgs.push({ role: 'q', text: q });
      this.chatInput = '';
      try {
        const r = await this.api('/api/admin/ai/chat', 'POST', { question: q });
        this.chatMsgs.push({ role: 'a', text: r.answer });
      } catch (e) { this.chatMsgs.push({ role: 'a', text: '查询失败：' + e.message }); }
    },
    // ---- 系统 ----
    async saveShop() {
      try {
        await this.api('/api/admin/shop', 'PUT', this.shopForm);
        this.msg('门店信息已保存');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    openStaffEdit(row) {
      this.staffForm = row ? { ...row, status: row.status || 'active' } : { username: '', name: '', role: 'waiter', password: '123456' };
      this.staffEditShow = true;
    },
    async saveStaff() {
      try {
        if (this.staffForm.id) await this.api('/api/admin/staff/' + this.staffForm.id, 'PUT', this.staffForm);
        else await this.api('/api/admin/staff', 'POST', this.staffForm);
        this.staffEditShow = false;
        this.msg('已保存');
        this.switchPage('sys');
      } catch (e) { this.msg(e.message, 'error'); }
    },
    async resetPwd(row) {
      try {
        const { value } = await this.$prompt('为 ' + row.name + ' 设置新密码', '重置密码', {
          inputPattern: /^.{4,}$/, inputErrorMessage: '至少 4 位',
        });
        await this.api('/api/admin/staff/' + row.id + '/reset-password', 'POST', { password: value });
        this.msg('密码已重置');
      } catch (e) { if (e !== 'cancel') this.msg(e.message, 'error'); }
    },
    openSupplierEdit(row) {
      this.supplierForm = row ? { ...row } : { name: '', contact: '', phone: '' };
      this.supplierEditShow = true;
    },
    async saveSupplier() {
      try {
        if (this.supplierForm.id) await this.api('/api/admin/suppliers/' + this.supplierForm.id, 'PUT', this.supplierForm);
        else await this.api('/api/admin/suppliers', 'POST', this.supplierForm);
        this.supplierEditShow = false;
        this.msg('已保存');
        this.switchPage('sys');
      } catch (e) { this.msg(e.message, 'error'); }
    },
  },
  mounted() {
    if (this.token) this.boot();
  },
});
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
